# ===================================
# Spring Boot Actuator Configuration
# ===================================
# Expose health, metrics, and info endpoints for load testing monitoring
management.endpoints.web.exposure.include=health,metrics,info,env
management.endpoint.health.show-details=always
management.metrics.export.simple.enabled=true

# HikariCP metrics (critical for connection pool monitoring)
management.metrics.enable.hikaricp=true

# ===================================
# SQL Query Logging (Load Testing)
# ===================================
# Show formatted SQL queries with parameter values
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Log query execution details
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# HikariCP connection pool logging
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari=TRACE
